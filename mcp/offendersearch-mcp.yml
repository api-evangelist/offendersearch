description: 'Offendersearch operates an official hosted (remote) MCP server. The marketing page (/mcp-server)
  describes it as private beta — "the hosted endpoint is not yet open to self-serve signups" — and shows
  the client config pointing at https://mcp.offendersearch.app with an X-API-Key header. Probed 2026-09-03:
  POST https://mcp.offendersearch.app/mcp answered a JSON-RPC tools/list unauthenticated with the live
  tool schemas (five tools, saved verbatim to offendersearch-mcp-tools.json), so the tool surface below
  is the server''s own answer, not the marketing copy. The page lists three tools; the live server exposes
  five — the two criminal-records tools are newer than the page. Tool calls are metered the same as REST
  calls ($0.15/call, $0.11 past 2,000/mo).'

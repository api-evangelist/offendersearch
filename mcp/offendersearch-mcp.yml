tools:
- name: search_offenders
  description: Search US sex-offender registries for one person and/or location. Fans out across all 58
    registries (or the ones named in jurisdictions), de-duplicates people across registries, scores each
    match, and returns the normalized records.
- name: batch_search
  description: Up to 1,000 queries in one call, one row in and one row out.
- name: get_registry_coverage
  description: Public catalog of every US registry covered, with scope, legal status and health. No API
    key required.
- name: search_criminal
  description: Search US criminal records — jail, prison, court and warrant.
- name: get_criminal_coverage
  description: Coverage catalog for the criminal jurisdictions.

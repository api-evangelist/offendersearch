note: >-
  Numeric limits are plan-defined and undocumented; the provider's guidance is
  to throttle proactively off the headers, prefer async/batch for large jobs,
  and back off exponentially respecting Retry-After.
scope: per-key
exhaustion_status: 429
headers:
  - name: X-RateLimit-Limit
    meaning: Requests allowed in the current window.
  - name: X-RateLimit-Remaining
    meaning: Requests left in the current window.
  - name: X-RateLimit-Reset
    meaning: Unix time when the window resets.
  - name: Retry-After
    meaning: On a 429, seconds to wait before retrying.

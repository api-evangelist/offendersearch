description: >-
  Requests are rate limited per API key; the sustained rate and monthly quota
  are set by the account's plan and the numeric values are not published. The
  runtime signal is fully documented: every response carries the current limit
  state in X-RateLimit-* headers, and a 429 carries Retry-After (seconds).
limit_count: 0

key_lifecycle:
  prefix: os_live_
  creation: Keys are created, named, rotated and revoked from the dashboard/API keys page; the secret
    is shown in full only once, at creation, and stored only as a one-way hash.
  rotation: Issue a second key, deploy it, then revoke the first — both valid at once, so rotation needs
    no downtime window.
  scoping: A key is a pure authentication credential — no per-key feature scopes; every key can call every
    documented endpoint. Usage is attributed per key.
security_posture:
  encryption: TLS in transit, AES-256 at rest for stored records and reports
  tenant_isolation: Data scoped per account; audit logging of account, timestamp and endpoint
  baa: Business Associate Agreement available to eligible enterprise accounts (HIPAA-ready path)
  source: https://offendersearch.app/docs/authentication.md
notes: AdminAuth (X-Admin-Key) is an internal credential, not part of the public API; QueryKeyAuth (?key=)
  exists only for the offenders.io compat endpoint demo mode.

description: >-
  Entity-relationship graph of the search surface. The central object is the
  Record — one normalized 76-field schema across every jurisdiction — which is
  a MERGE product: one person found in several registries is de-duplicated
  into one Record whose recordId/uuid describe the winning row, so recordId is
  scoped to the search that produced it, not a stable key for a person (the
  spec says so explicitly).
id_prefixes:
  - prefix: rec_
    entity: Record
    note: rec_ + 20 hex, hashed from jurisdiction + registry uuid (or url + name + dob when no uuid). Not a stable person key.
  - prefix: srch_
    entity: SearchResponse (async job)
  - prefix: os_live_
    entity: ApiKey secret
entities: [SearchRequest, Query, LiveBlock, SearchResponse, SourceStatus, Record, Name, Address, Offense, SourceRef, StateData, ProofBundle, SourceInfo, Account, ApiKey, Usage, Billing]
